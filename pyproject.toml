[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramp-mcp"
version = "0.1.0"
description = "MCP server for the Ramp Developer API (works with Hermes Agent and other MCP clients)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
ramp-mcp = "ramp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ramp_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
